name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build (arm64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build (amd64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/spotify-tui-rs dist/spotify-tui-rs
          tar -czf dist/spotify-tui-rs_darwin_arm64.tar.gz -C dist spotify-tui-rs
          rm dist/spotify-tui-rs
          cp target/x86_64-apple-darwin/release/spotify-tui-rs dist/spotify-tui-rs
          tar -czf dist/spotify-tui-rs_darwin_amd64.tar.gz -C dist spotify-tui-rs
          rm dist/spotify-tui-rs

      - name: Checksums
        run: |
          shasum -a 256 dist/spotify-tui-rs_darwin_arm64.tar.gz | awk '{print $1}' > dist/sha_arm64.txt
          shasum -a 256 dist/spotify-tui-rs_darwin_amd64.tar.gz | awk '{print $1}' > dist/sha_amd64.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spotify-tui-rs_darwin_arm64.tar.gz
            dist/spotify-tui-rs_darwin_amd64.tar.gz

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHA_ARM64="$(cat dist/sha_arm64.txt)"
          SHA_AMD64="$(cat dist/sha_amd64.txt)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/Wondr-design/homebrew-tap.git tap
          cat > tap/Formula/spotify-tui-rs.rb <<FORMULA
          class SpotifyTuiRs < Formula
            desc "Brutalist terminal UI for Spotify on macOS (Rust)"
            homepage "https://github.com/Wondr-design/Spotify_tui-rust"
            version "${VERSION}"

            on_arm do
              url "https://github.com/Wondr-design/Spotify_tui-rust/releases/download/${TAG}/spotify-tui-rs_darwin_arm64.tar.gz"
              sha256 "${SHA_ARM64}"
            end

            on_intel do
              url "https://github.com/Wondr-design/Spotify_tui-rust/releases/download/${TAG}/spotify-tui-rs_darwin_amd64.tar.gz"
              sha256 "${SHA_AMD64}"
            end

            def install
              bin.install "spotify-tui-rs"
            end

            test do
              system "#{bin}/spotify-tui-rs", "--version"
            end
          end
          FORMULA
          cd tap
          git add Formula/spotify-tui-rs.rb
          git commit -m "chore(release): update formula for ${TAG}"
          git push
